name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package
        shell: pwsh
        run: |
          npx electron-builder --win --x64 --publish never 2>&1 | Tee-Object -FilePath package.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path package.log -Pattern '⨯|error|failed|ENOENT' | Select-Object -Last 8 | ForEach-Object {
              $message = $_.Line.Trim()
              if ($message.Length -gt 350) { $message = $message.Substring(0, 350) }
              Write-Output "::error title=electron-builder::$message"
            }
            exit 1
          }
          Get-ChildItem release -File | ForEach-Object { Write-Output "artifact: $($_.Name) $($_.Length) bytes" }

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $repo = $env:GITHUB_REPOSITORY
          $title = "Coding Study Assistant $version"
          $notes = "Сборки для Windows x64.`n`n- Coding-Study-Assistant-$version-x64.exe — установщик (NSIS)`n- Coding-Study-Assistant-$version-portable.exe — portable-версия без установки`n`nAPI-ключ DeepSeek в сборку не входит: укажите его в «Настройках» при первом запуске."

          $release = gh api "repos/$repo/releases/tags/$tag" 2>$null | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release) {
            $release = gh api -X POST "repos/$repo/releases" -f tag_name=$tag -f name=$title -f body=$notes | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $release) { Write-Output '::error title=gh::release create failed'; exit 1 }
            Write-Output "created release $tag (id $($release.id))"
          } else {
            gh api -X PATCH "repos/$repo/releases/$($release.id)" -F draft=false -f name=$title -f body=$notes *> $null
            if ($LASTEXITCODE -ne 0) { Write-Output '::error title=gh::release publish failed'; exit 1 }
            Write-Output "published release $tag (id $($release.id))"
          }

          $assets = Get-ChildItem release -File | Where-Object { $_.Extension -eq '.exe' -or $_.Extension -eq '.blockmap' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName }
          Write-Output "uploading $($assets.Count) file(s) to $tag"
          gh release upload $tag $assets --clobber
          if ($LASTEXITCODE -ne 0) { Write-Output '::error title=gh::release upload failed'; exit 1 }

          $current = gh api "repos/$repo/releases/tags/$tag" 2>$null | ConvertFrom-Json
          foreach ($stale in $current.assets | Where-Object { $_.name -eq 'builder-debug.yml' }) {
            gh api -X DELETE "repos/$repo/releases/assets/$($stale.id)" *> $null
            Write-Output "removed stale asset $($stale.name)"
          }

          Write-Output "release $tag is published: $((($current.assets | Where-Object { $_.name -ne 'builder-debug.yml' }).name) -join ', ')"
          exit 0
