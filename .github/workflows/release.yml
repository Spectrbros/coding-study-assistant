name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package and publish
        shell: pwsh
        run: |
          npx electron-builder --win --x64 --publish always 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $interesting = Select-String -Path build.log -Pattern '⨯|error|HttpError|cannot|failed|ENOENT|403|404' | Select-Object -Last 8
            foreach ($line in $interesting) {
              $message = $line.Line.Trim()
              if ($message.Length -gt 350) { $message = $message.Substring(0, 350) }
              Write-Output "::error title=electron-builder::$message"
            }
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
